<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reiseplaner</title>
  <meta name="description" content="Reiseplaner für Asien und Südamerika: Tagesplan, Ideen, Tipps und Checkliste zum Durchklicken.">
  <meta name="theme-color" content="#F2F5F6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E1822" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Schriften laden nicht blockierend: In China ist Google Fonts oft gesperrt, dann greifen die Systemschriften.
       Die Schmuckschriften für Chinesisch, Koreanisch und Japanisch lädt app.js passend zu den Reisen. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="style.css">
</head>
<body class="is-home">
  <a class="skip" href="#app">Zum Inhalt</a>
  <header class="top">
    <div class="top-inner">
      <div class="brand-wrap">
        <a class="brand" href="#" title="Alle Reisen"><span class="seal hz" id="brand-seal" lang="ja" aria-hidden="true">旅</span><span>Reisen</span></a>
        <span class="crumb" id="crumb" hidden></span>
      </div>
      <nav class="tabs" aria-label="Bereiche">
        <a href="#" data-view="route"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="6" r="2"/><circle cx="19" cy="18" r="2"/><path d="M7 6h7a3.5 3.5 0 0 1 0 7h-4a3.5 3.5 0 0 0 0 7h7"/></svg><span>Route</span></a>
        <a href="#" data-view="tage"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span>Tage</span></a>
        <a href="#" data-view="ideen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.4.9 1 .9 1.7V16h5.2v-.4c0-.7.3-1.3.9-1.7A6 6 0 0 0 12 3Z"/></svg><span>Ideen</span></a>
        <a href="#" data-view="tipps"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H4ZM20 5.5A1.5 1.5 0 0 0 18.5 4H14a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h6Z"/></svg><span>Tipps</span></a>
        <a href="#" data-view="check"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12.5l2.8 2.8L16.5 9"/></svg><span>Checkliste</span></a>
      </nav>
    </div>
  </header>

  <main id="app" tabindex="-1">
    <noscript><p class="panel">Dieser Reiseplaner braucht JavaScript.</p></noscript>
  </main>

  <dialog id="modal" class="modal" aria-labelledby="modal-title">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="modal-title" class="modal-title"></h2>
        <button class="icon-btn" data-action="close-modal" aria-label="Schließen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </dialog>
  <dialog id="taxi" class="taxi" aria-label="Taxi-Karte"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>

  <!-- Neue Reise: Datei in trips/ anlegen und hier sowie in sw.js eintragen -->
  <script src="trips/china.js"></script>
  <script src="trips/korea.js"></script>
  <script src="trips/japan.js"></script>
  <script src="trips/mongolia.js"></script>
  <script src="trips/kyrgyzstan.js"></script>
  <script src="trips/azerbaijan.js"></script>
  <script src="trips/chile.js"></script>
  <script src="trips/argentina.js"></script>
  <script src="app.js"></script>
</body>
</html>
